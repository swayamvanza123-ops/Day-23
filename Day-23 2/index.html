<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockly | Inventory Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a href="#" class="brand app-brand" data-page="dashboard"><span class="brand-mark">S</span><span>Stockly</span></a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="side-nav" id="sideNav">
        <button class="nav-link active" data-page="dashboard"><span class="nav-icon">▦</span> Dashboard</button>
        <button class="nav-link" data-page="products"><span class="nav-icon">▣</span> Products</button>
        <button class="nav-link" data-page="categories"><span class="nav-icon">◈</span> Categories</button>
        <button class="nav-link" data-page="suppliers"><span class="nav-icon">♧</span> Suppliers</button>
        <button class="nav-link" data-page="sales"><span class="nav-icon">↗</span> Sales</button>
        <button class="nav-link" data-page="stock"><span class="nav-icon">⇄</span> Stock history</button>
        <button class="nav-link" data-page="batches"><span class="nav-icon">▤</span> Batches</button>
        <button class="nav-link" data-page="activity"><span class="nav-icon">◷</span> Activity log</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">✦</div><strong>Keep your stock healthy</strong><p>Review low-stock items and expiry dates regularly.</p><button data-page="products" class="text-button">Review products →</button></div>
        <button id="sidebarLogout" class="logout-link"><span>↪</span> Sign out</button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button id="menuToggle" class="mobile-menu" aria-label="Toggle menu">☰</button>
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="pageCrumb">Dashboard</strong></div>
        <div class="topbar-right">
          <div class="today-chip"><span class="status-dot"></span><span id="todayLabel">Today</span></div>
          <div class="user-chip"><div class="avatar" id="userAvatar">A</div><div><strong id="userName">Admin</strong><small id="userRole">Administrator</small></div></div>
          <button id="logoutButton" class="icon-button" title="Sign out" aria-label="Sign out">↪</button>
        </div>
      </header>
      <div id="noticeArea" class="notice-area" aria-live="polite"></div>
      <section id="pageContent" class="page-content"></section>
      <footer class="app-footer"><span>Stockly Inventory</span><span>Simple stock control for everyday work</span></footer>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/activityLog.js"></script>
  <script src="js/products.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/suppliers.js"></script>
  <script src="js/sales.js"></script>
  <script src="js/stockManagement.js"></script>
  <script src="js/batches.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
